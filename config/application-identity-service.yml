spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-health
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/actuator/health

            - id: identity-register
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/register
                - Method=POST

            - id: identity-login
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/login
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-refresh
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/refresh
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-logout
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/logout
                - Method=POST

            - id: identity-change-password
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/change-password
                - Method=POST
              filters:
                - name: AuthenticationFilter

            - id: identity-forgot-password
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/forgot-password
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-reset-password
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/reset-password
                - Method=POST

            - id: identity-verify-email
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/auth/verify-email
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-change-role
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/users/*/roles
                - Method=PATCH
              filters:
                - name: AuthenticationFilter
                - name: AuthorizationFilter
                  args:
                    requiredRole: ADMIN

            - id: identity-admin-list-users
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/admin/users
                - Method=GET
              filters:
                - name: AuthenticationFilter
                - name: AuthorizationFilter
                  args:
                    requiredRole: ADMIN

            - id: identity-admin-get-user
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/admin/users/**
                - Method=GET
              filters:
                - name: AuthenticationFilter
                - name: AuthorizationFilter
                  args:
                    requiredRole: ADMIN

            - id: identity-admin-update-status
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/admin/users/*/status
                - Method=PATCH
              filters:
                - name: AuthenticationFilter
                - name: AuthorizationFilter
                  args:
                    requiredRole: ADMIN
