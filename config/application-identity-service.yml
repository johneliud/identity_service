spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-register
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/register
                - Method=POST

            - id: identity-login
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/login
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-refresh
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/refresh
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-logout
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/logout
                - Method=POST

            - id: identity-change-password
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/change-password
                - Method=POST
              filters:
                - name: AuthenticationFilter

            - id: identity-forgot-password
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/forgot-password
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter

            - id: identity-reset-password
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/reset-password
                - Method=POST

            - id: identity-verify-email
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/verify-email
                - Method=GET
              filters:
                - name: RateLimitGatewayFilter
