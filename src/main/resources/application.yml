spring:
  application:
    name: identity_service
  config:
    import:
      - optional:classpath:application-secrets.properties

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT}
  url: ${IDENTITY_SERVICE_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

identity:
  registration:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION}
  email-verification:
    token-expiration-ms: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MS}
  email:
    enabled: ${EMAIL_ENABLED}
    from-address: ${EMAIL_FROM_ADDRESS}
    frontend-base-url: ${EMAIL_FRONTEND_BASE_URL}
  dev:
    include-verification-token-in-response: ${DEV_INCLUDE_VERIFICATION_TOKEN_IN_RESPONSE}
  kafka:
    enabled: ${KAFKA_ENABLED}
    topics:
      identity-events: ${KAFKA_TOPIC_IDENTITY_EVENTS}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
    kafka:
      enabled: false

logging:
  level:
    io.github.johneliud.identity_service: INFO
    org.springframework.web: INFO
