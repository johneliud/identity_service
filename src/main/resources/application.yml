spring:
  application:
    name: identity_service
  config:
    import:
      - optional:classpath:application-secrets.properties

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8081}
  url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

identity:
  registration:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  email-verification:
    token-expiration-ms: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MS:3600000}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@localhost}
    frontend-base-url: ${EMAIL_FRONTEND_BASE_URL:http://localhost:4200}
  dev:
    include-verification-token-in-response: ${DEV_INCLUDE_VERIFICATION_TOKEN_IN_RESPONSE:true}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      user-registered: ${KAFKA_TOPIC_USER_REGISTERED:user.registered}
      user-updated: ${KAFKA_TOPIC_USER_UPDATED:user.updated}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:10000}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}

logging:
  level:
    io.github.johneliud.identity_service: INFO
    org.springframework.web: INFO
