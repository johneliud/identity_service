application.name=identity-service

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

# Server Configuration
server.port=${SERVER_PORT}
server.url=${IDENTITY_SERVICE_URL}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# Registration Configuration
identity.registration.require-email-verification=${REQUIRE_EMAIL_VERIFICATION}

# Email Verification Configuration
identity.email-verification.token-expiration-ms=${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MS}

# Email (SMTP) Configuration
identity.email.enabled=${EMAIL_ENABLED}
identity.email.from-address=${EMAIL_FROM_ADDRESS}
identity.email.frontend-base-url=${EMAIL_FRONTEND_BASE_URL}

# Dev Mode Configuration
identity.dev.include-verification-token-in-response=${DEV_INCLUDE_VERIFICATION_TOKEN_IN_RESPONSE}

# Kafka Configuration
identity.kafka.enabled=${KAFKA_ENABLED}
identity.kafka.topics.identity-events=${KAFKA_TOPIC_IDENTITY_EVENTS}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Outbox Relay Configuration
identity.outbox.relay.fixed-delay-ms=${OUTBOX_RELAY_FIXED_DELAY_MS}
identity.outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE}

# Admin Seed Configuration
identity.admin.email=${ADMIN_EMAIL}
identity.admin.password=${ADMIN_PASSWORD}
identity.admin.first-name=${ADMIN_FIRST_NAME}
identity.admin.last-name=${ADMIN_LAST_NAME}

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
management.health.kafka.enabled=false