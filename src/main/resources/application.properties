spring.application.name=identity_service

# Server Configuration
server.port=${SERVER_PORT:8081}
server.url=${IDENTITY_SERVICE_URL:http://localhost:8081}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Registration Configuration
identity.registration.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}

# Kafka Configuration
identity.kafka.enabled=${KAFKA_ENABLED:false}
identity.kafka.topics.user-registered=${KAFKA_TOPIC_USER_REGISTERED:user.registered}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Import secrets (optional, for local development)
spring.config.import=optional:classpath:application-secrets.properties
