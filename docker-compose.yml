services:
  postgres:
    image: postgres:16-alpine
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-identity_db}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-identity_db}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    networks:
      - identity-network

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: identity-service:latest
    container_name: identity-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${DB_PORT}/${DB_NAME:-identity_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${SERVER_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - identity-network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    container_name: identity-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}"
    environment:
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SERVER_PORT=${GATEWAY_PORT}
    volumes:
      - ../identity_service/config/application-identity-service.yml:/app/config/application.yml:ro
    depends_on:
      - identity-service
    networks:
      - identity-network

volumes:
  identity_pgdata:

networks:
  identity-network:
    driver: bridge
